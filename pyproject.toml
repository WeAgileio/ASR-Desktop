[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-srt"
version = "0.2.0b2"
description = "Local Apple Silicon video-to-SRT generator using FunASR"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "funasr==1.3.12",
  "modelscope>=1.24,<2",
  "opencc-python-reimplemented>=0.1.7,<1",
  "rich>=13,<15",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
  "tiktoken>=0.7,<1",
  "faster-whisper==1.2.1",
  "transformers>=4.57.6,<5",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
asr-srt = "asr_srt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asr_desktop = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
