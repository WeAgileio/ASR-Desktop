name: Build desktop DMG

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          enable-cache: false

      - name: Prepare locked Python environment
        run: |
          test "$(uname -m)" = arm64
          uv python install 3.11.15
          uv venv --managed-python --python 3.11.15 build/desktop/packaging-env
          uv pip install --python build/desktop/packaging-env/bin/python \
            -r desktop/requirements/runtime.lock -r desktop/requirements/build.lock
          echo "$GITHUB_WORKSPACE/build/desktop/packaging-env/bin" >> "$GITHUB_PATH"

      - name: Validate version, release notes and annotated tag
        id: version
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          match = re.fullmatch(r'(\d+\.\d+\.\d+)b(\d+)', version)
          if not match:
              raise SystemExit('Only beta versions are supported by ad-hoc packaging')
          tag = f'v{match[1]}-beta.{match[2]}'
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag does not match pyproject.toml')
          if not re.search(r'^### ' + re.escape(tag) + r'(?:\s|$)', Path('README.md').read_text(), re.M):
              raise SystemExit('README release notes missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git cat-file -t "$GITHUB_REF")" = tag
          fi

      - name: Run desktop unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests/desktop -v

      - name: Run native unit tests
        run: python desktop/scripts/build_app.py --test

      - name: Build bundled media tools
        run: python desktop/scripts/build_media.py

      - name: Build, sign and verify beta DMG
        run: python desktop/scripts/package_release.py

      - name: Verify frozen runtime and media conversion
        run: python desktop/scripts/verify_runtime.py

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ steps.version.outputs.tag }}-arm64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            build/desktop/ASR-Desktop-*.dmg
            build/desktop/ASR-Desktop-*.dmg.sha256
            build/desktop/release-notes.md

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation
          if-no-files-found: ignore
          path: |
            build/desktop/*verification*.json
            build/desktop/*verification*.log

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ needs.build.outputs.tag }}-arm64
          path: release
      - name: Publish GitHub prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          sha256sum --check "ASR-Desktop-${RELEASE_TAG}-arm64.dmg.sha256"
          gh release create "$RELEASE_TAG" \
            "ASR-Desktop-${RELEASE_TAG}-arm64.dmg" \
            "ASR-Desktop-${RELEASE_TAG}-arm64.dmg.sha256" \
            --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file release-notes.md
