<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASR 轉錄工作台</title>
<style>
:root{font:16px/1.6 system-ui;color:#182a35;background:#f4f6f5}body{max-width:1150px;margin:32px auto;padding:0 24px}h1{margin:0;font-size:30px}h2{font-size:20px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #dce3df;border-radius:12px;padding:24px;margin-top:22px}label{display:block;margin-bottom:12px}input,select,button{font:inherit;border:1px solid #acbbb4;border-radius:6px;padding:8px}input{width:100%;box-sizing:border-box}button{background:#175f50;color:white;cursor:pointer}button.secondary{background:white;color:#175f50}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e1e6e3;overflow-wrap:anywhere}small,.muted{color:#536b61}#message{white-space:pre-wrap;color:#a03223}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:#175f50}dialog{width:min(850px,85vw);border:1px solid #9aad9f;border-radius:12px}#workers{font-size:14px}@media(max-width:700px){.row{grid-template-columns:1fr}section{padding:15px}td,th{padding:6px}}
</style></head><body>
<header><div><h1>ASR 轉錄工作台</h1><span class="muted">Google Drive → 本機辨識 → 逐字稿</span></div><button id="pause" class="secondary">暫停領取</button></header>
<p id="workers">正在連線…</p><p id="message" role="alert"></p>
<section><h2>新增轉錄批次</h2><form id="submit">
<div class="row"><label>來源資料夾<input name="source" required placeholder="Drive 資料夾連結或 ID"></label><label>結果資料夾<input name="destination" required placeholder="可寫入的資料夾（服務帳號須使用共用雲端硬碟）"></label></div>
<div class="row"><label>辨識模型 <select name="model"><option value="fun-asr-nano">Fun-ASR-Nano</option><option value="paraformer">Paraformer</option></select></label><label>辨識裝置 <select name="device"><option value="auto">自動選擇</option><option value="mps">MPS</option><option value="cpu">CPU</option></select></label></div>
<label>熱詞（逗號分隔）<input name="hotwords" placeholder="人名、產品名稱、專業術語"></label>
<label>自動重掃間隔（秒，0 表示只掃一次，最少 120 秒）<input name="interval" type="number" min="0" max="604800" value="0"></label>
<button>建立批次</button><small>　一次處理一個檔案；來源檔案不會修改。</small>
</form></section>
<section><h2>批次</h2><table><thead><tr><th>建立時間</th><th>來源</th><th>掃描狀態</th><th>操作</th></tr></thead><tbody id="batches"></tbody></table></section>
<section><h2>最近任務</h2><table><thead><tr><th>檔案</th><th>狀態</th><th>進度／錯誤</th><th>詳情</th></tr></thead><tbody id="jobs"></tbody></table><small>最多顯示最近 500 筆；批次詳情保留完整關聯。</small></section>
<dialog id="detail"><button id="close" class="secondary">關閉</button><h2>詳情</h2><div id="actions"></div><pre id="detail-text"></pre></dialog>
<script>
const csrf={{ csrf|tojson }};let paused=false;
const labels={pending:'等待掃描',scanning:'掃描中',completed:'已完成',queued:'排隊中',downloading:'下載中',transcribing:'辨識中',uploading:'上傳中',retry_wait:'等待重試',blocked:'需要處理',failed:'失敗',interrupted:'中斷待恢復'};
function error(e){document.querySelector('#message').textContent=e.message||String(e)}
async function call(url,body){const response=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.className='secondary';b.onclick=()=>Promise.resolve().then(fn).catch(error);return b}
function cell(row,text){const c=document.createElement('td');c.textContent=text;row.append(c);return c}
async function detail(type,id){const d=await call('/api/'+type+'/'+id);document.querySelector('#detail-text').textContent=JSON.stringify(d,null,2);const a=document.querySelector('#actions');a.replaceChildren();if(type==='batches'){a.append(button('重新掃描',async()=>{await call('/api/batches/'+id+'/rescan',{});await refresh()}));for(const j of d.jobs||[])a.append(button(j.payload.media.name+' · '+(labels[j.status]||j.status),()=>detail('jobs',j.id)))}else{if(['failed','blocked','interrupted'].includes(d.status))a.append(button('重試',async()=>{await call('/api/jobs/'+id+'/retry',{});document.querySelector('#detail').close();await refresh()}));if(d.status==='completed')for(const f of d.artifacts||[]){if(f.verified&&f.kind!=='version_folder'){const link=document.createElement('a');link.textContent=f.kind+'　';link.href='https://drive.google.com/file/d/'+encodeURIComponent(f.remote_id)+'/view';link.target='_blank';link.rel='noopener';a.append(link)}}}if(!document.querySelector('#detail').open)document.querySelector('#detail').showModal()}
async function refresh(){const d=await call('/api/overview');paused=d.paused;document.querySelector('#pause').textContent=paused?'恢復領取':'暫停領取';const now=Date.now()/1000;document.querySelector('#workers').textContent=d.workers.length?d.workers.map(w=>w.name+'：'+(now-w.heartbeat>90?'失聯':'在線')).join('　'):'尚無 worker 連線';const batches=document.querySelector('#batches');batches.replaceChildren();for(const b of d.batches){const tr=document.createElement('tr');cell(tr,new Date(b.created*1000).toLocaleString());cell(tr,b.payload.source);cell(tr,(labels[b.status]||b.status)+(b.error?'：'+b.error:''));cell(tr,'').append(button('查看',()=>detail('batches',b.id)));batches.append(tr)}const jobs=document.querySelector('#jobs');jobs.replaceChildren();for(const j of d.jobs){const tr=document.createElement('tr');cell(tr,j.payload.media.path);cell(tr,(labels[j.status]||j.status)+(j.offline?'（失聯）':''));const p=j.progress||{};let text=j.error||p.message||'';if(!j.error&&p.total&&p.current!==null)text+=(p.progress_kind==='estimated'?' 約 ':' ')+(100*p.current/p.total).toFixed(1)+'%';cell(tr,text);cell(tr,'').append(button('查看',()=>detail('jobs',j.id)));jobs.append(tr)}}
document.querySelector('#submit').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);const b=e.target.querySelector('button');b.disabled=true;try{await call('/api/batches',{source:f.get('source'),destination:f.get('destination'),interval_seconds:Number(f.get('interval')),settings:{model:f.get('model'),device:f.get('device'),hotwords:String(f.get('hotwords')).split(',').filter(Boolean)}});document.querySelector('#message').textContent='批次已建立，等待掃描程序。';await refresh()}catch(e){error(e)}finally{b.disabled=false}};
document.querySelector('#pause').onclick=()=>call('/api/pause',{paused:!paused}).then(refresh).catch(error);document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();refresh().catch(error);setInterval(()=>refresh().catch(error),5000);
</script></body></html>
